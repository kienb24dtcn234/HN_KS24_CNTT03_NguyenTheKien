# ============================================================
# Cấu hình RIÊNG cho payment-service (Config Server phân phát)
# ============================================================
server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopmart_payment?createDatabaseIfNotExist=true
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # Câu 3: Kafka cho payment-service (nhận INVENTORY_RESERVED -> thanh toán)
  kafka:
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.shopmart.payment.event.OrderEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Giả lập cổng thanh toán (dùng chứng minh Saga rollback ở Câu 3)
payment:
  # Đặt true để cố tình làm thanh toán thất bại
  simulate-failure: false
  # Giao dịch vượt hạn mức sẽ thất bại (vd: đặt 3 chiếc MacBook = 84.000.000)
  max-amount: 80000000
